name: Feature request
description: An idea to make AgentFlow better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or workflow behind the idea, in your own words.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could AgentFlow help?
      description: Your idea for a solution. Mockups and examples from other tools are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
