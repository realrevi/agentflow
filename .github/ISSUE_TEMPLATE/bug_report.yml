name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please remove API keys, tokens and private paths from anything you paste.
        Security problems: please report them privately (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a Claude Code panel
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AgentFlow version
      description: Settings → About, or the status bar.
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple silicon)
        - macOS (Intel)
        - Linux (AppImage)
        - Linux (.deb)
        - Linux (.rpm)
        - Other
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version and agent CLIs
      placeholder: Windows 11 24H2, Claude Code 2.x, Gemini CLI 0.x
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: |
        If AgentFlow crashed, attach `crash.log` from its data folder:
        Windows `%APPDATA%\dev.agentflow.desktop`, macOS `~/Library/Application Support/dev.agentflow.desktop`,
        Linux `~/.local/share/dev.agentflow.desktop`.
      render: text
